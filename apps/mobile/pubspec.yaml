name: stayconnect
description: "India's Nationwide Accommodation & Roommate Discovery Platform (Android & iOS)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Serialization
  dio: ^5.4.0
  intl: ^0.19.0

  # State Management & Reactive UI
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Maps & Hyperlocal GPS
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Push Notifications & Cloud Messaging
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # Deep Linking (Universal Links / App Links)
  app_links: ^6.0.1

  # Local Cache & Offline State
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1

  # UI Primitives & Icons
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
